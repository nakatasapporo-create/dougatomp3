
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>動画をMP3に変換</title>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"
    integrity="sha512-xT0S/xXvkrfkRXGBPlzZPCAncnMK5c1N7slRkToUbv8Z901aUEuKO84tLy8dWU+3ew4InFEN7TebPaVMy2npZw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #64748b;
      --surface: #ffffff;
      --page: #f4f7fb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --line: #dce4ef;
      --good: #047857;
      --bad: #b91c1c;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      background: radial-gradient(circle at 10% 0%, #e0ebff 0, transparent 34rem), var(--page);
      color: var(--ink);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(24px, 6vw, 42px);
      border: 1px solid rgba(220, 228, 239, .9);
      border-radius: 24px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 22px 60px rgba(15, 23, 42, .12);
    }

    h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.05rem); letter-spacing: -.03em; }
    .lead { margin: 10px 0 26px; color: var(--muted); line-height: 1.65; }

    .picker {
      display: block;
      padding: 26px 16px;
      border: 2px dashed #b6c7df;
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }

    .picker:hover, .picker:focus-within, .picker.dragover {
      border-color: var(--accent);
      background: #f3f7ff;
    }

    .picker:active { transform: scale(.99); }
    .picker input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .picker strong { display: block; font-size: 1rem; }
    .picker span { display: block; margin-top: 7px; color: var(--muted); font-size: .9rem; }

    .file {
      min-height: 1.5em;
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    .actions { display: grid; gap: 10px; margin-top: 24px; }
    button {
      appearance: none;
      min-height: 50px;
      border: 0;
      border-radius: 13px;
      padding: 12px 16px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(37, 99, 235, .22);
      transition: background .15s, transform .15s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.secondary { background: #e8eef8; color: #1e3a5f; box-shadow: none; }
    button.secondary:hover:not(:disabled) { background: #dce7f6; }
    button:disabled { opacity: .48; cursor: not-allowed; }

    .progress-wrap { margin-top: 24px; }
    progress { width: 100%; height: 10px; overflow: hidden; border: 0; border-radius: 999px; }
    progress::-webkit-progress-bar { background: #e8eef7; border-radius: inherit; }
    progress::-webkit-progress-value { background: var(--accent); border-radius: inherit; }
    progress::-moz-progress-bar { background: var(--accent); border-radius: inherit; }

    .status { min-height: 1.5em; margin: 11px 2px 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
    .status[data-kind="success"] { color: var(--good); }
    .status[data-kind="error"] { color: var(--bad); }
    .note { margin: 22px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.65; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>iPad、iPhoneで撮影、または、画面収録した動画をMP3に変換</h1>
    <p class="lead">動画を選ぶと、この端末内で音声をMP3に変換します。iPad、iPhoneでは、変換中はこの画面を開いたままにしてください。</p>

    <label class="picker" id="picker">
      <input id="fileInput" type="file" accept="video/*,audio/*">
      <strong>動画または音声ファイルを選択</strong>
      <span>タップしてファイルを選択</span>
    </label>
    <p class="file" id="fileName" aria-live="polite">ファイルはまだ選択されていません。</p>

    <div class="actions">
      <button id="convertButton" type="button" disabled>MP3に変換</button>
      <button id="saveButton" class="secondary hidden" type="button">MP3を保存・共有</button>
    </div>

    <div class="progress-wrap" id="progressWrap" hidden>
      <progress id="progress" max="100" value="0">0%</progress>
      <p class="status" id="status" aria-live="polite"></p>
    </div>

    <p class="note">変換にはインターネット接続が必要です（MP3エンコーダーの読み込み用）。ファイル自体はサーバーへアップロードされません。iPad、iPhoneで再生できない形式の動画は変換できません。</p>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const fileInput = $('fileInput');
      const picker = $('picker');
      const fileName = $('fileName');
      const convertButton = $('convertButton');
      const saveButton = $('saveButton');
      const progressWrap = $('progressWrap');
      const progress = $('progress');
      const status = $('status');

      let selectedFile = null;
      let convertedFile = null;
      let convertedUrl = null;
      let isConverting = false;
      let cancelCurrentConversion = null;

      function setStatus(message, kind = '') {
        status.textContent = message;
        status.dataset.kind = kind;
      }

      function setProgress(value) {
        progress.value = Math.max(0, Math.min(100, value));
      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes)) return '';
        const units = ['B', 'KB', 'MB', 'GB'];
        let value = bytes;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit += 1;
        }
        return `${value >= 10 || unit === 0 ? value.toFixed(0) : value.toFixed(1)} ${units[unit]}`;
      }

      function mp3Name(name) {
        const base = (name || 'audio').replace(/\.[^/.]+$/, '') || 'audio';
        return `${base}.mp3`;
      }

      function revokeConvertedUrl() {
        if (convertedUrl) URL.revokeObjectURL(convertedUrl);
        convertedUrl = null;
        convertedFile = null;
        saveButton.classList.add('hidden');
      }

      function resetForFile(file) {
        if (isConverting && cancelCurrentConversion) cancelCurrentConversion();
        revokeConvertedUrl();
        selectedFile = file || null;
        convertButton.disabled = !selectedFile;
        fileName.textContent = selectedFile
          ? `${selectedFile.name}（${formatBytes(selectedFile.size)}）`
          : 'ファイルはまだ選択されていません。';
        progressWrap.hidden = true;
        setProgress(0);
        setStatus('');
      }

      function eventOnce(target, success, failures = []) {
        return new Promise((resolve, reject) => {
          const events = [success, ...failures];
          const cleanup = () => events.forEach((eventName) => target.removeEventListener(eventName, handler));
          const handler = (event) => {
            cleanup();
            if (event.type === success) resolve(event);
            else reject(event);
          };
          events.forEach((eventName) => target.addEventListener(eventName, handler, { once: true }));
        });
      }

      async function waitForMetadata(video) {
        if (video.readyState >= HTMLMediaElement.HAVE_METADATA && Number.isFinite(video.duration)) return;
        await eventOnce(video, 'loadedmetadata', ['error', 'abort']);
        if (!Number.isFinite(video.duration)) throw new Error('動画の長さを取得できませんでした。');
      }

      function floatTo16BitPCM(samples) {
        const pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i += 1) {
          const sample = Math.max(-1, Math.min(1, samples[i]));
          pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        return pcm;
      }

      function readableMediaError(video) {
        const code = video.error && video.error.code;
        if (code === 4) return 'このiPad、iPhone Safariでは再生できない動画形式です。MP4（H.264/AAC）など、iPad、iPhoneで再生できる形式を使ってください。';
        if (code === 3) return '動画の音声をデコードできませんでした。別の動画形式でお試しください。';
        return '動画を読み込めませんでした。ファイルが壊れていないか確認してください。';
      }

      function cleanupMedia({ video, source, processor, silentGain, context, objectUrl }) {
        try { source && source.disconnect(); } catch (_) { /* already disconnected */ }
        try { processor && processor.disconnect(); } catch (_) { /* already disconnected */ }
        try { silentGain && silentGain.disconnect(); } catch (_) { /* already disconnected */ }
        try { video && video.pause(); } catch (_) { /* already paused */ }
        if (video) {
          video.removeAttribute('src');
          try { video.load(); } catch (_) { /* no-op */ }
          video.remove();
        }
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        if (context) {
          // Close releases the iOS audio session; older Safari versions may only support suspend.
          Promise.resolve(context.close ? context.close() : context.suspend()).catch(() => {});
        }
      }

      async function convertUsingMediaElement(file) {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) throw new Error('このブラウザは音声変換に対応していません。');
        if (!window.lamejs || !window.lamejs.Mp3Encoder) throw new Error('MP3エンコーダーを読み込めませんでした。通信状態を確認して、もう一度お試しください。');

        let context;
        let video;
        let source;
        let processor;
        let silentGain;
        let objectUrl;
        let cancelled = false;
        let encoder;
        let mp3Chunks = [];
        let inputSamples = 0;

        const cancel = () => {
          cancelled = true;
          if (video) video.pause();
        };
        cancelCurrentConversion = cancel;

        try {
          objectUrl = URL.createObjectURL(file);
          video = document.createElement('video');
          video.preload = 'auto';
          video.playsInline = true;
          video.setAttribute('playsinline', '');
          video.setAttribute('aria-hidden', 'true');
          video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-2px;top:-2px';
          video.src = objectUrl;
          document.body.appendChild(video);

          // These calls deliberately happen before the first await. On iPhone Safari, a media
          // element started after an async metadata wait can lose the button's user activation.
          // Starting it here lets the native media pipeline load in the background while the
          // PCM tap is already connected.
          context = new AudioContextCtor();
          const resumeContext = context.resume();

          source = context.createMediaElementSource(video);
          // ScriptProcessor is intentionally used here: it is supported by older iPhone Safari,
          // unlike AudioWorklet on several iOS versions. Keeping it connected to a zero-gain
          // destination makes Safari continue to deliver decoded PCM without audible playback.
          processor = context.createScriptProcessor(4096, 2, 2);
          silentGain = context.createGain();
          silentGain.gain.value = 0;
          source.connect(processor);
          processor.connect(silentGain);
          silentGain.connect(context.destination);

          processor.onaudioprocess = (event) => {
            if (cancelled) return;
            const input = event.inputBuffer;
            const channels = input.numberOfChannels > 1 ? 2 : 1;
            if (!encoder) encoder = new lamejs.Mp3Encoder(channels, context.sampleRate, 128);

            const left = floatTo16BitPCM(input.getChannelData(0));
            const encoded = channels === 2
              ? encoder.encodeBuffer(left, floatTo16BitPCM(input.getChannelData(1)))
              : encoder.encodeBuffer(left);
            if (encoded.length > 0) mp3Chunks.push(new Uint8Array(encoded));

            inputSamples += input.length;
            const bySamples = inputSamples / context.sampleRate;
            const played = Math.max(video.currentTime || 0, bySamples);
            setProgress(Math.min(99, (played / video.duration) * 100));
            setStatus(`変換中… ${Math.min(99, Math.round((played / video.duration) * 100))}%`);
          };

          const playbackEnded = eventOnce(video, 'ended', ['error', 'abort']);
          video.load();
          const startPlayback = video.play().then(() => null, (error) => error);
          setStatus('動画を読み込んでいます…');
          try {
            await resumeContext;
            await waitForMetadata(video);
            if (cancelled) throw new DOMException('Cancelled', 'AbortError');
            const playbackError = await startPlayback;
            if (playbackError) throw playbackError;
          } catch (error) {
            if (error && error.type === 'error') throw new Error(readableMediaError(video));
            throw new Error('iPad、iPhoneの音声再生を開始できませんでした。もう一度「MP3に変換」をタップしてください。');
          }
          await playbackEnded;
          if (cancelled) throw new DOMException('Cancelled', 'AbortError');

          // Let the last ScriptProcessor callback reach the encoder before flushing it.
          await new Promise((resolve) => window.setTimeout(resolve, 120));
          if (!encoder || inputSamples === 0) throw new Error('動画に変換可能な音声が見つかりませんでした。');
          const tail = encoder.flush();
          if (tail.length > 0) mp3Chunks.push(new Uint8Array(tail));
          setProgress(100);
          return new File(mp3Chunks, mp3Name(file.name), { type: 'audio/mpeg' });
        } catch (error) {
          if (error && error.type === 'error' && video) throw new Error(readableMediaError(video));
          throw error;
        } finally {
          cancelCurrentConversion = null;
          cleanupMedia({ video, source, processor, silentGain, context, objectUrl });
        }
      }

      async function startConversion() {
        if (!selectedFile || isConverting) return;
        isConverting = true;
        convertButton.disabled = true;
        revokeConvertedUrl();
        progressWrap.hidden = false;
        setProgress(0);

        try {
          convertedFile = await convertUsingMediaElement(selectedFile);
          convertedUrl = URL.createObjectURL(convertedFile);
          setStatus(`変換が完了しました（${formatBytes(convertedFile.size)}）。「MP3を保存・共有」をタップしてください。`, 'success');
          saveButton.classList.remove('hidden');
        } catch (error) {
          const cancelled = error && error.name === 'AbortError';
          setStatus(cancelled ? '変換を中止しました。' : `変換できませんでした：${error.message || '不明なエラー'}`, 'error');
          console.error('MP3 conversion failed:', error);
        } finally {
          isConverting = false;
          convertButton.disabled = !selectedFile;
        }
      }

      async function saveOrShare() {
        if (!convertedFile || !convertedUrl) return;
        // A direct user tap is required for the iPhone share sheet / file save flow.
        try {
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [convertedFile] })) {
            await navigator.share({ files: [convertedFile], title: convertedFile.name });
            return;
          }
        } catch (error) {
          if (error && error.name === 'AbortError') return; // Share sheet closed by the user.
        }

        const link = document.createElement('a');
        link.href = convertedUrl;
        link.download = convertedFile.name;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      fileInput.addEventListener('change', () => resetForFile(fileInput.files && fileInput.files[0]));
      convertButton.addEventListener('click', startConversion);
      saveButton.addEventListener('click', saveOrShare);

      // Desktop drag-and-drop is kept as a convenience without changing the iPhone flow.
      ['dragenter', 'dragover'].forEach((eventName) => picker.addEventListener(eventName, (event) => {
        event.preventDefault();
        picker.classList.add('dragover');
      }));
      ['dragleave', 'drop'].forEach((eventName) => picker.addEventListener(eventName, (event) => {
        event.preventDefault();
        picker.classList.remove('dragover');
      }));
      picker.addEventListener('drop', (event) => {
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (file) resetForFile(file);
      });
      window.addEventListener('pagehide', () => {
        if (isConverting && cancelCurrentConversion) cancelCurrentConversion();
      });
    })();
  </script>
</body>
</html>
